name: CI

on:
  push:
    branches: [dev, stable, main]
  pull_request:
    branches: [dev, stable, main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  test:
    name: Vitest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        # CI provides inert Supabase env dummies via vitest setup
        # (tests/setup.ts) — no real secrets needed for the unit suite.
        run: npm test
